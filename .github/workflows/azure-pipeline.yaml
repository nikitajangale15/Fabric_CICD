name: Fabric CLI OIDC Authentication
on:
  workflow_dispatch:

jobs:
  authenticate:
    name: Authenticate with Microsoft Fabric
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment: FABRIC-UAT
    env:
      CLIENT_ID: ${{ vars.CLIENT_ID }}
      TENANT_ID: ${{ vars.TENANT_ID }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Fabric CLI
        run: |
          python -m pip install --upgrade pip
          pip install ms-fabric-cli
          fab --version

      - name: Authenticate with OIDC Federated Token
        uses: actions/github-script@v7
        id: id-token
        with:
          script: |
            // Request OIDC token with Entra ID audience
            const id_token = await core.getIDToken(
              'api://AzureADTokenExchange'
            );

            // Mask token in workflow logs
            core.setSecret(id_token);

            // Pass token to next step
            core.setOutput('id_token', id_token);

      - name: Run Fabric CLI Commands
        env:
          FEDERATED_TOKEN: ${{ steps.id-token.outputs.id_token }}
        run: |
          fab auth login \
            -u "$CLIENT_ID" \
            --tenant "$TENANT_ID" \
            --federated-token "$FEDERATED_TOKEN"

      # Step 5: Verify Fabric Authentication
      - name: Verify Fabric Authentication
        run: |
          fab auth status
          fab ls
