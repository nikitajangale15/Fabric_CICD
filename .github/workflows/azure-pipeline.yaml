
name: Fabric CLI OIDC Authentication

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  fabric-auth:
    name: Fabric CLI Login
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Fabric CLI
        run: python -m pip install --upgrade pip && python -m pip install ms-fabric-cli && fab --version

      - name: Fetch GitHub OIDC Token
        id: get-token
        shell: bash
        run: |
          FEDERATED_TOKEN=$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r '.value')
          if [[ -z "$FEDERATED_TOKEN" || "$FEDERATED_TOKEN" == "null" ]]; then echo "Failed to fetch GitHub OIDC token"; exit 1; fi
          echo "::add-mask::$FEDERATED_TOKEN"
          echo "FEDERATED_TOKEN=$FEDERATED_TOKEN" >> "$GITHUB_ENV"
          echo "GitHub OIDC token fetched successfully."

      - name: Enable Fabric CLI Encryption Fallback
        run: fab config set encryption_fallback_enabled true

      - name: Fabric CLI Login
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
        run: fab auth logout || true; fab auth login -u "$CLIENT_ID" --federated-token "$FEDERATED_TOKEN" --tenant "$TENANT_ID" && fab auth status

      - name: Verify Fabric Authentication
        run: fab auth status

      - name: Verify Fabric Workspace Access
        run: fab ls

      - name: Cleanup
        if: always()
        run: echo "FEDERATED_TOKEN=" >> "$GITHUB_ENV"
