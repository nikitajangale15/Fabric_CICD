
name: Fabric CLI OIDC Authentication

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  fabric-auth:
    name: Fabric CLI Login
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Fabric CLI
        run: python -m pip install --upgrade pip && python -m pip install --upgrade ms-fabric-cli && fab --version

      - name: Fetch GitHub OIDC Token
        shell: bash
        run: |
          set -euo pipefail
          FEDERATED_TOKEN=$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r '.value')
          if [[ -z "$FEDERATED_TOKEN" || "$FEDERATED_TOKEN" == "null" ]]; then echo "Failed to fetch OIDC token"; exit 1; fi
          echo "::add-mask::$FEDERATED_TOKEN"
          echo "FEDERATED_TOKEN=$FEDERATED_TOKEN" >> "$GITHUB_ENV"
          echo "OIDC token fetched successfully."

      - name: Diagnose GitHub OIDC Claims
        shell: bash
        run: python -c 'import os,json,base64; t=os.environ["FEDERATED_TOKEN"]; p=t.split(".")[1]; p+="="*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:d.get(k) for k in ["iss","aud","sub","repository","ref","workflow_ref"]},indent=2))'

      - name: Configure Fabric CLI Authentication
        shell: bash
        env:
          FAB_SPN_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          FAB_TENANT_ID: ${{ secrets.TENANT_ID }}
          FAB_SPN_FEDERATED_TOKEN: ${{ env.FEDERATED_TOKEN }}
        run: |
          set -euo pipefail
          fab config set encryption_fallback_enabled true
          fab auth status
          echo "Fabric CLI authentication configuration completed."

      - name: Verify Fabric Workspace Access
        env:
          FAB_SPN_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          FAB_TENANT_ID: ${{ secrets.TENANT_ID }}
          FAB_SPN_FEDERATED_TOKEN: ${{ env.FEDERATED_TOKEN }}
        run: fab ls

      - name: Cleanup
        if: always()
        run: echo "FEDERATED_TOKEN=" >> "$GITHUB_ENV"
